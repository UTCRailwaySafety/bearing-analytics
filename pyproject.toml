[project]
name = "bearing-analytics"
version = "0.1.0"
description = "Python scripts for working with bearing experiment lab data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Carter Vavra", email = "carter.vavra01@utrgv.edu" }
]
requires-python = ">=3.14"
dependencies = ["duckdb>=2.0.0"]

[project.scripts]
ingest = "bearing_analytics:ingest"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
